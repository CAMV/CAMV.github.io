title: Cristian Medina | Unity Game Developer & Computer Engineer
description: Portfolio of Cristian Medina, Game Developer and Computer Engineer using C#, Unity and 3D asset pipelines.
tagline: Unity Game Developer | Computer Engineer | 3D Hobbyist
url: https://camv.github.io
lang: en_US
image: assets/images/portfolio_preview.jpg

defaults:
  - scope:
      path: "" # Applies to all files in the project
    values:
      image: /assets/images/og-preview.png

baseurl: ""
markdown: kramdown

home_title: Cristian Medina
home_subtitle: Unity Game Developer | Computer Engineer | 3D Hobbyist  
home_description: > 
  I'm a Unity Game Developer and Computer Engineer with experience leading the development of gameplay systems,
  tools, content integration, debugging, and team coordination for video games and interactive applications. My
  background includes Unity, C#, Python, Blender workflows, and cross-functional production in remote team
  environments.

author: Cristian Medina

social:
  name : Cristian Medina  
  links:
    - https://www.linkedin.com/in/cristian-medina-256140b5/
    - https://waunman.itch.io/
    - https://sketchfab.com/WaunMan
    - https://github.com/camv

seo:
  type: "Person"
  name: "Cristian Medina"

permalink: /:slug

remote_theme: abhinavs/moonwalk

collections:
  contacts:
    output: true
  skills:
    output: true
  projects:
    output: true
  misc_projects:
    output: true

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  appearance_toggle: true # if appearance can be switched by user
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description
  show_navbar: true # show horizontal navbar
  show_footer: true # show footer links in home page,add in _data/home.yml
  show_copyright: true # show copyright notice in footer
  # following keys are using to create home layout
  show_projects: true # show projects as cards, add in _data/home.yml
  show_skill_card: false # show skills card list in home header, add in _data/home.yml under skills
  show_skill_section: true # show skills card list in home header, add in _data/home.yml under skills
  show_skill_slide: false # show skills slide list in home header, add in _data/home.yml under skills, same as in skills_card but in a slide format
  show_blog: false # show blog posts added in _posts
  show_old_projects: false # show old projects as cards, add in _data/home.yml
  show_misc_list: false # show generic vertical list for misc details, add _data/home.yml
  show_reading_time: true # show number of words and reading time in the blog posts
  show_tags: true # show tags in a blog posts
  show_code_copy: true # show copy button on code blocks
  show_progress_bar: true # show reading progress bar on posts
  show_back_to_top: true # show back-to-top button
  show_post_nav: true # show prev/next links on posts
  show_toc: true # allow per-post table of contents via toc: true front matter
  show_footnote_tooltips: true # show footnote text on hover instead of scrolling to bottom
  show_link_previews: true # show preview cards when hovering internal post links
  # options for "home" page
  home:
    title_projects: Portfolio
    title_skills: Skills
    title_misc_list: Misc List
    title_blog: Blog
    title_old_projects: Old Projects
    title_primary_capsules: Contributions
    title_secondary_capsules: Tools
    project_learn_more: Learn More
    skills_slide_window_size: 3
    skills_slide_step_size: 1
  platforms:
    title_steam: Steam
    title_itch: Itch.io
    title_playstore: Android
    title_appstore: iOS
    title_website: Website
  icons:
    steam_light: assets/icons/steam_light.svg
    steam_dark: assets/icons/steam_dark.svg
    itch_light: assets/icons/itch_light.svg
    itch_dark: assets/icons/itch_dark.svg
    playstore_light: assets/icons/googleplay_light.svg
    playstore_dark: assets/icons/googleplay_dark.svg
    appstore_light: assets/icons/appstore_light.svg
    appstore_dark: assets/icons/appstore_dark.svg
    website_light: assets/icons/website_light.svg
    website_dark: assets/icons/website_dark.svg


soopr:
  publish_token: "" # sign up at https://www.soopr.co to get your publish token and personalize share and reaction options

highlighter: rouge

sass:
  style: :compressed

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap

markdown_output:
  collections: [posts, contacts, skills, projects, misc_projects]

llms_output:
  index:
    enabled: false
  full:
    collections: [posts, contacts, projects, skills, misc_projects]
    respect_markdown_output: true